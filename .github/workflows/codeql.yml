# CodeQL code scanning, advanced setup so it is versioned here: Rust and
# the workflows themselves, on every push and pull request and weekly,
# because new queries appear without any change in this repo. The alerts
# show under Security > Code scanning; the release workflow refuses a tag
# while a high or critical one is open on its branch. Settings > Code
# security > Code scanning > Default setup stays off: it cannot run beside
# this workflow.
#
# Third-party actions are pinned to full commit SHAs (Sonar's
# githubactions:S7637); the comment names the version.
name: CodeQL

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    - cron: "47 4 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [rust, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}
