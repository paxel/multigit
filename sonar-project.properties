# SonarQube Cloud: https://sonarcloud.io/summary/new_code?id=paxel_multigit
# Analysed by .github/workflows/sonar.yml on pushes to summer; Automatic
# Analysis is off in the project's settings.
sonar.organization=paxel
sonar.projectKey=paxel_multigit
sonar.projectName=multigit

# The app's code; the unit tests inside src/ are analysed with it. The
# Python tools in tool/ have no coverage report and stay out.
sonar.sources=src
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# Clippy: the workflow writes this report with cargo clippy
# --message-format=json; the analyzer imports it as external issues.
sonar.rust.clippyReport.reportPaths=build/clippy-report.json

# Coverage: tool/coverage.sh writes this LCOV file with src/ only, the
# paths absolute.
sonar.rust.lcov.reportPaths=coverage/lcov.info
