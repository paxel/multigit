name: Release

on:
  push:
    tags:
      - "v*"

# Build jobs run third-party build scripts: they only get a read-only token.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check tag matches Cargo.toml version
        id: version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          case "$version" in
            ""|*[!0-9A-Za-z.+-]*) echo "::error::Unexpected version '$version' in Cargo.toml"; exit 1 ;;
          esac
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # Every gate CI has, and more: format, clippy with the lints in
  # Cargo.toml, all tests, no known vulnerability in Cargo.lock
  # (OSV-Scanner), a CHANGELOG section for the version, no open high or
  # critical CodeQL alert, and the coverage floor. The release needs it.
  gate:
    name: Gate
    needs: version
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: read
    steps:
      # The full history, so the code-scanning step finds the branches
      # that hold the tagged commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: osv-scanner
        continue-on-error: true
        uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          scan-args: |-
            --format=json
            --output-file=osv-results.json
            --recursive
            ./
      - name: No known vulnerability (unmaintained notices reported only)
        run: python3 tool/osv_gate.py osv-results.json

      - name: CHANGELOG.md has a section for this version
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: packaging/release-notes.sh "$VERSION" > /dev/null

      # CodeQL analyses branches, not tags: every open alert on a branch
      # that holds this commit is listed, and one of severity high or
      # critical (security severity, or rule severity error) stops the
      # release. A branch CodeQL never analysed is skipped; none analysed
      # at all stops it too.
      - name: No open high or critical code-scanning alert
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-parse HEAD)
          branches=$(git branch -r --contains "$sha" --format='%(refname:lstrip=3)' | grep -vx HEAD || true)
          analysed=0
          blocking=0
          for b in $branches; do
            if ! gh api --paginate "repos/$GITHUB_REPOSITORY/code-scanning/alerts?ref=refs/heads/$b&state=open&per_page=100" \
              --jq '.[] | [(.rule.security_severity_level // "-"), .rule.severity, .rule.id, .most_recent_instance.location.path, .html_url] | @tsv' \
              > "$RUNNER_TEMP/alerts.tsv" 2> "$RUNNER_TEMP/error.txt"; then
              if grep -q 'no analysis found' "$RUNNER_TEMP/error.txt"; then
                echo "$b: not analysed by CodeQL, skipped"
                continue
              fi
              cat "$RUNNER_TEMP/error.txt" >&2
              exit 1
            fi
            analysed=$((analysed + 1))
            echo "Open code-scanning alerts on $b (security severity, severity, rule, file, link):"
            cat "$RUNNER_TEMP/alerts.tsv"
            n=$(awk -F'\t' '$1 == "high" || $1 == "critical" || $2 == "error"' "$RUNNER_TEMP/alerts.tsv" | wc -l)
            echo "$n of them high or critical"
            blocking=$((blocking + n))
          done
          [ "$analysed" -gt 0 ] || { echo "no CodeQL analysis on any branch that holds $sha" >&2; exit 1; }
          [ "$blocking" -eq 0 ] || { echo "$blocking open high or critical code-scanning alerts" >&2; exit 1; }

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10-16
        with:
          toolchain: stable
          components: rustfmt, clippy, llvm-tools-preview

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Format, lint and tool tests
        run: |
          cargo fmt --check
          cargo clippy --all-targets --locked -- -D warnings
          (cd tool && python3 -m unittest test_osv_gate test_coverage_floor)

      # Runs every test once, with coverage. Below the floor in
      # tool/coverage-floor.txt stops the release; a floor that rose is
      # raised on the runner only: raise it with a local run of
      # tool/coverage.sh and commit it.
      - name: Tests and coverage floor
        run: |
          cargo install cargo-llvm-cov --locked --version 0.9.1
          tool/coverage.sh

  linux:
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10-16
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Build
        run: cargo build --release --locked --target x86_64-unknown-linux-gnu

      - name: Package
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          name="multigit-$VERSION-x86_64-linux"
          mkdir "$name"
          cp target/x86_64-unknown-linux-gnu/release/multigit "$name/"
          cp packaging/linux/install.sh packaging/linux/install-icon.sh packaging/linux/io.github.paxel.multigit.desktop "$name/"
          cp assets/icon_256.png README.md CHANGELOG.md "$name/"
          tar -czf "$name.tar.gz" "$name"

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: linux
          path: multigit-*.tar.gz

  macos:
    needs: version
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10-16
        with:
          toolchain: stable
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Build universal binary
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
          lipo -create -output multigit \
            target/aarch64-apple-darwin/release/multigit \
            target/x86_64-apple-darwin/release/multigit

      - name: Package
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          name="multigit-$VERSION-macos-universal"
          mkdir "$name"
          packaging/macos/bundle.sh multigit "$VERSION" "$name"
          ditto -c -k --keepParent "$name/multigit.app" "$name.zip"

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: macos
          path: multigit-*.zip

  publish:
    needs: [version, gate, linux, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Release notes from CHANGELOG.md
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: packaging/release-notes.sh "$VERSION" > release-notes.md

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "multigit $VERSION" \
            --notes-file release-notes.md

  # Only after the release exists: the formula and the cask point at its
  # assets. Needs the repository secret CHANNEL_PAT, a token that may push
  # to paxel/homebrew-tap.
  homebrew:
    name: Homebrew tap
    needs: [version, publish]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Render the formula and the cask with the artifacts' checksums
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: packaging/render-channels.sh "$VERSION" dist out

      - name: Push to the tap
        env:
          GH_TOKEN: ${{ secrets.CHANNEL_PAT }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          git config --global user.name "multigit-release-bot"
          git config --global user.email "taum@tuta.io"
          git clone "https://x-access-token:${GH_TOKEN}@github.com/paxel/homebrew-tap.git" tap
          mkdir -p tap/Casks tap/Formula
          cp out/multigit-formula.rb tap/Formula/multigit.rb
          cp out/multigit-cask.rb tap/Casks/multigit.rb
          git -C tap add Formula/multigit.rb Casks/multigit.rb
          git -C tap diff --cached --quiet || git -C tap commit -m "multigit $VERSION"
          git -C tap push
