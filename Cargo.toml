[package]
name = "multigit"
version = "0.2.0"
edition = "2024"
description = "Desktop dashboard for many git repositories"
license = "MIT"
repository = "https://github.com/paxel/multigit"
publish = false

[dependencies]
eframe = "0.35"
egui = "0.35"
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
shell-words = "1"
thiserror = "2"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
egui_kittest = "0.35"
# The fonts egui draws with and a reader for them: a test looks up the
# glyphs the app relies on.
epaint_default_fonts = "0.35"
tempfile = "3"
ttf-parser = "0.25"

# Production code may not unwrap, expect, panic or index; tests may
# (clippy.toml). CI runs clippy with -D warnings, so these fail the build.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "deny"
