# CodeQL code scanning, advanced setup so it is versioned here: Rust and
# the workflows themselves, on every push and pull request and weekly,
# because new queries appear without any change in this repo. The alerts
# show under Security > Code scanning; the release workflow refuses a tag
# while a high or critical one is open on its branch. Settings > Code
# security > Code scanning > Default setup stays off: it cannot run beside
# this workflow.
#
# Third-party actions are pinned to full commit SHAs (Sonar's
# githubactions:S7637); the comment names the version.
name: CodeQL

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    - cron: "47 4 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [rust, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          category: /language:${{ matrix.language }}
